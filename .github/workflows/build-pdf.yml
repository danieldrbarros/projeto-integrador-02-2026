name: Build README PDF

on:
  push:
    branches:
      - main
      - master
    paths:
      - "README.md"
      - "assets/docs/style.css"
      - "assets/docs/template.html"
      - ".github/workflows/build-pdf.yml"  
  workflow_dispatch:

permissions:
  contents: write

jobs:

  build-pdf:

    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:

      ######################################################################
      # Checkout
      ######################################################################

      - name: Checkout repository
        uses: actions/checkout@v4

      ######################################################################
      # Python
      ######################################################################

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      ######################################################################
      # Pandoc
      ######################################################################

      - name: Setup Pandoc
        uses: pandoc/actions/setup@v1

      ######################################################################
      # Cache pip
      ######################################################################

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-weasyprint
          restore-keys: |
            ${{ runner.os }}-pip-

      ######################################################################
      # Install WeasyPrint
      ######################################################################

      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install weasyprint

      ######################################################################
      # Show versions
      ######################################################################

      - name: Show versions

        run: |

          pandoc --version

          weasyprint --version

      ######################################################################
      # Convert Markdown -> HTML
      ######################################################################

      - name: Generate HTML

        run: |

          pandoc README.md \
            --from=gfm \
            --standalone \
            --toc \
            --number-sections \
            --metadata title="Projeto Integrador II" \
            --template=template.html \
            --css=style.css \
            --output=README.html

      ######################################################################
      # Convert HTML -> PDF
      ######################################################################

      - name: Generate PDF

        run: |

          weasyprint \
            README.html \
            README.pdf

      ######################################################################
      # Upload artifact
      ######################################################################

      - name: Upload PDF

        uses: actions/upload-artifact@v4

        with:

          name: README-PDF

          path: README.pdf

          if-no-files-found: error